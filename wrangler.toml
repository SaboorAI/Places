name = "places"
main = "worker/index.js"
compatibility_date = "2026-03-09"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[build]
command = "npm run build"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"

# Automatically provisions durable SQLite storage on the existing places Worker.
[[durable_objects.bindings]]
name = "ATLAS_STORE"
class_name = "AtlasStore"

[[migrations]]
tag = "atlas-v1"
new_sqlite_classes = ["AtlasStore"]
